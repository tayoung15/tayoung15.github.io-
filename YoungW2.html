<!DOCTYPE html>
<html>

<head>
    <title>Taylor Young</title>
    <style>

        .monospace {
             font-family: "Lucida Console", "Courier New", monospace;
        }

        @media (max-width: 600px) {
        img {
         width: 250px;
         height: 250px;
        }

        nav {
         flex-direction: column;
         gap: 10px;
        }

        a button {
         width: 150px;
         height: 60px;
         font-size: 16px;
         }

      }


        h1 {
         text-align: center;

        body {
            background-color: #505E4F;

            font-family: "Courier New", monospace;
            text-align: center;
        }

        .container { 
            width: 798px; 
        }

        nav {
         position: sticky;
         top: 0;
         background-color: #505E4F;
        }

    
        img {
         height: 400px; 
         width: 400px; 
         object-fit: cover;
          border-radius: 0%;
          display: block;
          border: 5px solid #000000;
          margin: 40px auto;
        }


        .content {
            width: inherit;
            height: 738px;
            background-color: #ffffff00;
            border-radius: 76px 76px 0px 0px;
            color: #ffffff;
            align-items: center;
        }

        .container > nav{
            background-color: "black";
            color: #000000 
        }

        a button {
            background-color: #000000;
          
            width: 183px;
            height: 87px;
            border-radius: 25px;
            text-align: center;
            border-color: #000000;
            border-width: 0px;
            border-style: none;
            object-position: center;

            
        }

        a button {
            color: #FFFFFF; 
            font-family: "Courier New";
            font-size: 20px;
            font-style: italic;
            font-weight: 400;
            text-transform: uppercase;
            text-decoration: none;
        }

 

         a:hover button {

            background-color: #ffffff;
            color: #000000; 
            font-family: "Courier New";
            font-size: 20px; 
            font-style: italic; 
            font-weight: 800; 
            letter-spacing: 4px;
            text-decoration: underline; 
            border-color: #000000;
            border-width: 1px;
            border-style: solid;
        }

        #taylor {
            background-color: inherit; 
            color: #000000;
            font-family: "Courier New";
            font-size: 64px;
            font-style: italic;
            font-weight: 800;
            line-height: normal;
        }

        #sectionHeadings{

            background-color: inherit; 
            color: #000000;
            font: "Courier New";
            font-size: 48px;
            font-style: bold;
            font-weight: 800;
            line-height: normal;

        }


    </style>
</head>

<body>

    <section class="container">
        <img src="pistolfalldown.jpeg" id="pic-of-me" alt="A picture of a me, fallen down to the ground">
